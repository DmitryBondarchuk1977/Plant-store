<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --card: var(--tg-theme-secondary-bg-color, #f3f3f7);
    --radius: 14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.4}
  body{padding:12px 12px 90px;max-width:680px;margin:0 auto}
  img{max-width:100%;display:block}
  .hidden{display:none!important}
  .hint{color:var(--hint);font-size:14px}
  .center{text-align:center}
  .row{display:flex;align-items:center;gap:10px}
  .price{font-weight:700}

  /* ---- header ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;
    margin:4px 0 14px;gap:10px}
  .topbar h1{font-size:20px;margin:0}
  .cart-btn{position:relative;border:none;background:var(--card);color:var(--text);
    border-radius:12px;padding:8px 12px;font-size:15px;font-weight:600}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--btn);color:var(--btn-text);
    min-width:20px;height:20px;border-radius:10px;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 5px}

  /* ---- catalog grid ---- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;
    cursor:pointer;display:flex;flex-direction:column}
  .card .thumb{aspect-ratio:1/1;background:#0001 center/cover no-repeat;width:100%}
  .card .body{padding:10px 12px}
  .card .name{font-size:14px;font-weight:600;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .price{margin-top:6px;font-size:15px}

  /* ---- detail ---- */
  .detail-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:var(--radius);
    background:var(--card)}
  .detail h2{margin:14px 0 4px;font-size:22px}
  .detail .desc{color:var(--text);margin:10px 0;white-space:pre-wrap}

  /* ---- buttons ---- */
  .btn{border:none;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;
    width:100%;cursor:pointer}
  .btn-primary{background:var(--btn);color:var(--btn-text)}
  .btn-ghost{background:var(--card);color:var(--text)}
  .btn-danger{background:#e0394522;color:#e03945}
  .btn-sm{padding:8px 12px;font-size:14px;width:auto}

  /* ---- cart ---- */
  .cart-item{display:flex;gap:12px;background:var(--card);border-radius:var(--radius);
    padding:10px;margin-bottom:10px;align-items:center}
  .cart-item img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#0001}
  .cart-item .meta{flex:1;min-width:0}
  .cart-item .name{font-size:14px;font-weight:600}
  .qty{display:flex;align-items:center;gap:0;background:var(--bg);border-radius:10px;overflow:hidden}
  .qty button{border:none;background:transparent;color:var(--text);width:30px;height:30px;
    font-size:18px;cursor:pointer}
  .qty span{min-width:24px;text-align:center;font-weight:600}
  .total-row{display:flex;justify-content:space-between;align-items:center;
    font-size:18px;font-weight:700;margin:16px 2px}

  /* ---- forms ---- */
  label{display:block;font-size:13px;color:var(--hint);margin:14px 2px 6px}
  input,textarea{width:100%;background:var(--card);border:1px solid transparent;
    border-radius:12px;padding:12px;font-size:16px;color:var(--text);font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--btn)}
  textarea{resize:vertical;min-height:70px}

  /* ---- admin ---- */
  .admin-item{display:flex;gap:10px;align-items:center;background:var(--card);
    border-radius:12px;padding:8px;margin-bottom:8px}
  .admin-item img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:#0001}
  .admin-item .meta{flex:1;min-width:0}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
  .tag.on{background:#23b26d22;color:#1a9e5e}
  .tag.off{background:#e0394522;color:#e03945}
  .spacer{height:14px}

  /* ---- admin tabs ---- */
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;border:none;border-radius:10px;padding:9px;font-size:14px;font-weight:600;
    background:var(--card);color:var(--text);cursor:pointer}
  .tabs button.active{background:var(--btn);color:var(--btn-text)}

  /* ---- request cards ---- */
  .req{background:var(--card);border-radius:var(--radius);padding:12px;margin-bottom:12px}
  .req .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .req .head .id{font-weight:700;font-size:15px}
  .req .head .date{font-size:12px;color:var(--hint)}
  .req .who{margin:8px 0 2px;font-size:14px;font-weight:600}
  .req .contact a{color:var(--link);text-decoration:none;font-size:14px}
  .req .lines{margin:8px 0;font-size:13px;color:var(--text)}
  .req .lines div{padding:1px 0}
  .req .cmt{font-size:13px;color:var(--hint);margin:6px 0;font-style:italic}
  .req .sum{font-weight:700;margin:6px 0 10px}
  .status-tag{font-size:11px;padding:3px 9px;border-radius:7px;font-weight:600;white-space:nowrap}
  .st-new{background:#2481cc22;color:#2481cc}
  .st-in_progress{background:#f0a01e22;color:#d98a00}
  .st-done{background:#23b26d22;color:#1a9e5e}
  .st-canceled{background:#e0394522;color:#e03945}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;border:none;border-radius:9px;padding:8px 4px;font-size:12.5px;font-weight:600;
    background:var(--bg);color:var(--text);cursor:pointer;opacity:.65}
  .seg button.on{opacity:1;outline:2px solid var(--btn)}
</style>
</head>
<body>

<!-- CATALOG -->
<section id="view-catalog">
  <div class="topbar">
    <h1 id="catalog-title">Каталог</h1>
    <button class="cart-btn" id="open-cart">Заявка
      <span class="badge hidden" id="cart-badge">0</span>
    </button>
  </div>
  <div id="catalog-grid" class="grid"></div>
  <p id="catalog-empty" class="hint center hidden" style="margin-top:40px">Каталог пока пуст.</p>
  <div class="spacer"></div>
  <button class="btn btn-ghost hidden" id="go-admin">⚙️ Админка (товары и заявки)</button>
</section>

<!-- DETAIL -->
<section id="view-detail" class="hidden detail">
  <img id="d-img" class="detail-img" alt="" />
  <h2 id="d-name"></h2>
  <div id="d-price" class="price" style="font-size:20px"></div>
  <div id="d-desc" class="desc"></div>
  <div class="spacer"></div>
  <button class="btn btn-primary" id="d-add">В заявку</button>
</section>

<!-- CART -->
<section id="view-cart" class="hidden">
  <div class="topbar"><h1>Заявка</h1></div>
  <div id="cart-list"></div>
  <p id="cart-empty" class="hint center hidden" style="margin-top:40px">В заявке пока нет товаров.</p>
  <div class="total-row hidden" id="total-row"><span>Итого</span><span id="cart-total"></span></div>
</section>

<!-- CHECKOUT -->
<section id="view-checkout" class="hidden">
  <div class="topbar"><h1>Оформление</h1></div>
  <label>Имя</label>
  <input id="f-first" type="text" placeholder="Имя" />
  <label>Фамилия</label>
  <input id="f-last" type="text" placeholder="Фамилия" />
  <label>Телефон</label>
  <input id="f-phone" type="tel" placeholder="+7 ..." />
  <button class="btn btn-ghost btn-sm hidden" id="share-phone" style="margin-top:8px;width:100%">
    📱 Подтвердить номер из Telegram
  </button>
  <label>Комментарий (необязательно)</label>
  <textarea id="f-comment" placeholder="Например, удобное время для звонка"></textarea>
  <div class="total-row"><span>Итого</span><span id="checkout-total"></span></div>
</section>

<!-- ADMIN -->
<section id="view-admin" class="hidden">
  <div class="topbar"><h1>Админка</h1>
    <button class="cart-btn" id="admin-add">+ Товар</button></div>
  <div class="tabs">
    <button id="tab-products" class="active" onclick="switchAdminTab('products')">Товары</button>
    <button id="tab-requests" onclick="switchAdminTab('requests')">Заявки</button>
  </div>
  <div id="admin-list"></div>
  <div id="requests-list" class="hidden"></div>
  <p id="requests-empty" class="hint center hidden" style="margin-top:40px">Заявок пока нет.</p>
</section>

<!-- ADMIN FORM -->
<section id="view-admin-form" class="hidden">
  <div class="topbar"><h1 id="af-title">Новый товар</h1></div>
  <label>Название</label>
  <input id="af-name" type="text" />
  <label>Описание</label>
  <textarea id="af-desc"></textarea>
  <label>Цена, ₽</label>
  <input id="af-price" type="number" inputmode="decimal" />
  <label>Картинка</label>
  <input id="af-file" type="file" accept="image/*" />
  <img id="af-preview" class="hidden" style="margin-top:10px;width:120px;height:120px;object-fit:cover;border-radius:12px" />
  <label class="row" style="margin-top:14px;color:var(--text)">
    <input type="checkbox" id="af-active" checked style="width:auto" /> Показывать в каталоге
  </label>
  <div class="spacer"></div>
  <button class="btn btn-danger hidden" id="af-delete" style="margin-bottom:10px">Удалить товар</button>
</section>

<script>
// ============ КОНФИГ — заполни своими значениями ============
const CONFIG = {
  SUPABASE_URL:  "https://lnkwlaunbsqixezapyjj.supabase.co",
  SUPABASE_ANON: "sb_publishable_pKh-kHLH9pkf9U4Er99KQQ_MvJEvSVt",
  FUNCTION_BASE: "https://lnkwlaunbsqixezapyjj.supabase.co/functions/v1/bot",
};
// ===========================================================

const tg = window.Telegram?.WebApp;
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON);
const $ = (id) => document.getElementById(id);
const fmt = (n) => new Intl.NumberFormat("ru-RU").format(Math.round(n)) + " ₽";

let PRODUCTS = [];           // активные товары каталога
let CART = loadCart();       // { productId: qty }
let ME = { is_admin:false, first_name:"", last_name:"", phone:"" };
let currentProductId = null;
let editingProductId = null;
let newImageBase64 = null;

const VIEWS = ["catalog","detail","cart","checkout","admin","admin-form"];
let view = "catalog";

function show(name){
  view = name;
  VIEWS.forEach(v => $("view-"+v).classList.toggle("hidden", v!==name));
  window.scrollTo(0,0);
  updateChrome();
}

// ---------- Telegram chrome (MainButton / BackButton) ----------
function updateChrome(){
  if(!tg) return;
  tg.BackButton.offClick(onBack); tg.BackButton.onClick(onBack);
  tg.MainButton.offClick(onMain); tg.MainButton.onClick(onMain);

  if(view==="catalog"){ tg.BackButton.hide(); cartCount()>0 ? mainBtn("Заявка · "+fmt(cartTotal())) : tg.MainButton.hide(); }
  else if(view==="detail"){ tg.BackButton.show(); tg.MainButton.hide(); }
  else if(view==="cart"){ tg.BackButton.show(); cartCount()>0 ? mainBtn("Оформить заявку") : tg.MainButton.hide(); }
  else if(view==="checkout"){ tg.BackButton.show(); mainBtn("Отправить заявку"); }
  else if(view==="admin"){ tg.BackButton.show(); tg.MainButton.hide(); }
  else if(view==="admin-form"){ tg.BackButton.show(); mainBtn("Сохранить"); }
}
function mainBtn(text){ tg.MainButton.setText(text); tg.MainButton.show(); tg.MainButton.enable(); }

function onBack(){
  if(view==="detail") show("catalog");
  else if(view==="cart") show("catalog");
  else if(view==="checkout") show("cart");
  else if(view==="admin") show("catalog");
  else if(view==="admin-form") show("admin");
}
function onMain(){
  if(view==="catalog"){ renderCart(); show("cart"); }
  else if(view==="cart"){ openCheckout(); }
  else if(view==="checkout") submitRequest();
  else if(view==="admin-form") saveProduct();
}

// ---------- Cart ----------
function loadCart(){ try{ return JSON.parse(localStorage.getItem("cart")||"{}"); }catch{ return {}; } }
function saveCart(){ try{ localStorage.setItem("cart", JSON.stringify(CART)); }catch{} renderBadge(); }
function cartCount(){ return Object.values(CART).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(CART).reduce((s,[id,q])=>{ const p=PRODUCTS.find(x=>x.id===id); return s+(p?Number(p.price)*q:0); },0); }
function renderBadge(){ const n=cartCount(); $("cart-badge").textContent=n; $("cart-badge").classList.toggle("hidden", n===0); }

// ---------- Catalog ----------
async function loadCatalog(){
  const { data, error } = await sb.from("products").select("*")
    .eq("is_active", true).order("sort_order").order("created_at",{ascending:false});
  PRODUCTS = error ? [] : (data||[]);
  renderCatalog();
  renderBadge();
}
function renderCatalog(){
  const grid = $("catalog-grid"); grid.innerHTML="";
  $("catalog-empty").classList.toggle("hidden", PRODUCTS.length>0);
  PRODUCTS.forEach(p=>{
    const el = document.createElement("div");
    el.className="card";
    el.innerHTML = `
      <div class="thumb" style="background-image:url('${p.image_url||""}')"></div>
      <div class="body">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="price">${fmt(p.price)}</div>
      </div>`;
    el.onclick = ()=> openDetail(p.id);
    grid.appendChild(el);
  });
}

// ---------- Detail ----------
function openDetail(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  currentProductId = id;
  $("d-img").src = p.image_url||"";
  $("d-name").textContent = p.name;
  $("d-price").textContent = fmt(p.price);
  $("d-desc").textContent = p.description||"";
  renderDetailBtn();
  show("detail");
}
function renderDetailBtn(){
  const inCart = CART[currentProductId]>0;
  const b = $("d-add");
  b.textContent = inCart ? "✓ В заявке — убрать" : "В заявку";
  b.className = "btn " + (inCart ? "btn-ghost" : "btn-primary");
}
$("d-add").onclick = ()=>{
  if(CART[currentProductId]>0) delete CART[currentProductId];
  else CART[currentProductId] = 1;
  saveCart(); renderDetailBtn();
  tg?.HapticFeedback?.impactOccurred("light");
};

// ---------- Cart view ----------
function renderCart(){
  const list = $("cart-list"); list.innerHTML="";
  const entries = Object.entries(CART);
  $("cart-empty").classList.toggle("hidden", entries.length>0);
  $("total-row").classList.toggle("hidden", entries.length===0);
  entries.forEach(([id,qty])=>{
    const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
    const el = document.createElement("div");
    el.className="cart-item";
    el.innerHTML = `
      <img src="${p.image_url||""}" alt="" />
      <div class="meta">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="price">${fmt(p.price)}</div>
      </div>
      <div class="qty">
        <button data-act="minus">−</button><span>${qty}</span><button data-act="plus">+</button>
      </div>
      <button class="btn btn-danger btn-sm" data-act="del">✕</button>`;
    el.querySelector('[data-act="minus"]').onclick=()=>{ CART[id]=Math.max(1,qty-1); saveCart(); renderCart(); };
    el.querySelector('[data-act="plus"]').onclick =()=>{ CART[id]=qty+1; saveCart(); renderCart(); };
    el.querySelector('[data-act="del"]').onclick  =()=>{ delete CART[id]; saveCart(); renderCart(); updateChrome(); };
    list.appendChild(el);
  });
  $("cart-total").textContent = fmt(cartTotal());
  updateChrome();
}

// ---------- Checkout ----------
function openCheckout(){
  $("f-first").value = ME.first_name||"";
  $("f-last").value  = ME.last_name||"";
  $("f-phone").value = ME.phone||"";
  $("checkout-total").textContent = fmt(cartTotal());
  // кнопка подтверждения номера из Telegram (Bot API 8.0+)
  $("share-phone").classList.toggle("hidden", !(tg && typeof tg.requestContact==="function"));
  show("checkout");
}
$("share-phone").onclick = ()=>{
  try{
    tg.requestContact((ok, ev)=>{
      // в разных клиентах форма ответа отличается — пытаемся вытащить телефон
      const c = ev?.responseUnsafe?.contact || ev?.contact;
      const phone = c?.phone_number;
      if(phone) $("f-phone").value = phone;
    });
  }catch(e){ tg?.showAlert?.("Не удалось получить номер. Введите вручную."); }
};

async function submitRequest(){
  const items = Object.entries(CART).map(([product_id,qty])=>({product_id,qty}));
  if(!items.length) return;
  const first = $("f-first").value.trim();
  const phone = $("f-phone").value.trim();
  if(!first){ tg?.showAlert?.("Укажите имя"); return; }
  if(!phone){ tg?.showAlert?.("Укажите телефон"); return; }

  tg?.MainButton.showProgress?.();
  const res = await api("/submit","POST",{
    items, firstName:first, lastName:$("f-last").value.trim(),
    phone, comment:$("f-comment").value.trim(),
  });
  tg?.MainButton.hideProgress?.();

  if(res?.ok){
    CART={}; saveCart();
    tg?.HapticFeedback?.notificationOccurred?.("success");
    tg?.showAlert?.("✅ Заявка отправлена! Менеджер свяжется с вами.", ()=> tg?.close?.());
    show("catalog");
  } else {
    tg?.showAlert?.("Ошибка отправки: "+(res?.error||"попробуйте позже"));
  }
}

// ---------- Admin ----------
async function loadAdmin(){
  const res = await api("/admin/products","GET");
  const list = $("admin-list"); list.innerHTML="";
  (res?.products||[]).forEach(p=>{
    const el=document.createElement("div");
    el.className="admin-item";
    el.innerHTML=`
      <img src="${p.image_url||""}" alt="" />
      <div class="meta">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="hint">${fmt(p.price)} · <span class="tag ${p.is_active?'on':'off'}">${p.is_active?'в каталоге':'скрыт'}</span></div>
      </div>
      <button class="btn btn-ghost btn-sm">✎</button>`;
    el.querySelector("button").onclick=()=>openAdminForm(p);
    list.appendChild(el);
  });
}

// открыть админку (по умолчанию вкладка «Товары»)
async function openAdmin(){
  switchAdminTab("products");
  await loadAdmin();
  show("admin");
}

let adminTab = "products";
function switchAdminTab(tab){
  adminTab = tab;
  $("tab-products").classList.toggle("active", tab==="products");
  $("tab-requests").classList.toggle("active", tab==="requests");
  $("admin-list").classList.toggle("hidden", tab!=="products");
  $("admin-add").classList.toggle("hidden", tab!=="products");
  $("requests-list").classList.toggle("hidden", tab!=="requests");
  $("requests-empty").classList.add("hidden");
  if(tab==="requests") loadRequests();
}

// ---------- Заявки ----------
const STATUSES = [
  { key:"new",         label:"Новая" },
  { key:"in_progress", label:"В работе" },
  { key:"done",        label:"Выполнена" },
];
const STATUS_LABEL = { new:"Новая", in_progress:"В работе", done:"Выполнена", canceled:"Отменена" };

async function loadRequests(){
  const res = await api("/admin/requests","GET");
  const list = $("requests-list"); list.innerHTML="";
  const reqs = res?.requests || [];
  $("requests-empty").classList.toggle("hidden", reqs.length>0);
  reqs.forEach(r=> list.appendChild(renderRequest(r)));
}

function renderRequest(r){
  const el = document.createElement("div");
  el.className = "req";
  const date = new Date(r.created_at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const items = (r.items||[]).map(i=>`<div>• ${escapeHtml(i.product_name)} × ${i.qty} — ${fmt(i.price*i.qty)}</div>`).join("");
  const phone = (r.phone||"").trim();
  const name = `${escapeHtml(r.customer_first_name||"")} ${escapeHtml(r.customer_last_name||"")}`.trim() || "—";
  el.innerHTML = `
    <div class="head">
      <span class="id">Заявка #${r.id}</span>
      <span class="status-tag st-${r.status}">${STATUS_LABEL[r.status]||r.status}</span>
    </div>
    <div class="date">${date}</div>
    <div class="who">${name}</div>
    <div class="contact">${phone ? `<a href="tel:${phone}">📞 ${escapeHtml(phone)}</a>` : '<span class="hint">телефон не указан</span>'}</div>
    ${r.comment ? `<div class="cmt">💬 ${escapeHtml(r.comment)}</div>` : ""}
    <div class="lines">${items}</div>
    <div class="sum">Итого: ${fmt(r.total)}</div>
    <div class="seg"></div>`;
  const seg = el.querySelector(".seg");
  STATUSES.forEach(s=>{
    const b = document.createElement("button");
    b.textContent = s.label;
    if(r.status===s.key) b.classList.add("on");
    b.onclick = ()=> setStatus(r, s.key, el);
    seg.appendChild(b);
  });
  return el;
}

async function setStatus(r, status, el){
  if(r.status===status) return;
  const res = await api("/admin/requests","PATCH",{ id:r.id, status });
  if(res?.request){
    r.status = status;
    tg?.HapticFeedback?.impactOccurred?.("light");
    el.replaceWith(renderRequest(r));
  } else {
    tg?.showAlert?.("Не удалось изменить статус: "+(res?.error||""));
  }
}
function openAdminForm(p){
  editingProductId = p?.id || null;
  newImageBase64 = null;
  $("af-title").textContent = p ? "Редактирование" : "Новый товар";
  $("af-name").value = p?.name||"";
  $("af-desc").value = p?.description||"";
  $("af-price").value = p?.price||"";
  $("af-active").checked = p ? !!p.is_active : true;
  const prev=$("af-preview");
  if(p?.image_url){ prev.src=p.image_url; prev.classList.remove("hidden"); } else prev.classList.add("hidden");
  $("af-delete").classList.toggle("hidden", !p);
  $("af-file").value="";
  show("admin-form");
}
$("af-file").onchange = (e)=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ newImageBase64=r.result; $("af-preview").src=r.result; $("af-preview").classList.remove("hidden"); };
  r.readAsDataURL(file);
};
async function saveProduct(){
  const name=$("af-name").value.trim();
  if(!name){ tg?.showAlert?.("Укажите название"); return; }
  const payload={
    name, description:$("af-desc").value.trim(),
    price:Number($("af-price").value)||0, is_active:$("af-active").checked,
  };
  if(newImageBase64) payload.imageBase64=newImageBase64;
  tg?.MainButton.showProgress?.();
  let res;
  if(editingProductId){ payload.id=editingProductId; res=await api("/admin/products","PATCH",payload); }
  else res=await api("/admin/products","POST",payload);
  tg?.MainButton.hideProgress?.();
  if(res?.product){ await loadCatalog(); await loadAdmin(); show("admin"); }
  else tg?.showAlert?.("Ошибка: "+(res?.error||"не удалось сохранить"));
}
$("af-delete").onclick = async ()=>{
  if(!editingProductId) return;
  tg?.showConfirm ? tg.showConfirm("Удалить товар?", (ok)=> ok && doDelete()) : confirm("Удалить?") && doDelete();
  async function doDelete(){
    const res=await api("/admin/products?id="+editingProductId,"DELETE");
    if(res?.ok){ await loadCatalog(); await loadAdmin(); show("admin"); }
    else tg?.showAlert?.("Ошибка удаления");
  }
};

// ---------- API helper ----------
async function api(path, method, body){
  try{
    const r = await fetch(CONFIG.FUNCTION_BASE+path, {
      method,
      headers:{ "content-type":"application/json", "x-init-data": tg?.initData||"" },
      body: body ? JSON.stringify(body) : undefined,
    });
    return await r.json();
  }catch(e){ return { error:String(e) }; }
}

function escapeHtml(s){ return (s||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }

// ---------- nav bindings ----------
$("open-cart").onclick = ()=>{ renderCart(); show("cart"); };
$("go-admin").onclick  = ()=> openAdmin();
$("admin-add").onclick = ()=> openAdminForm(null);

// ---------- init ----------
(async function init(){
  tg?.ready(); tg?.expand?.();
  try{ tg?.setHeaderColor?.("secondary_bg_color"); }catch{}
  await loadCatalog();
  const me = await api("/me","POST",{});
  if(me && !me.error){ ME = me; }
  $("go-admin").classList.toggle("hidden", !ME.is_admin);
  show("catalog");
})();
</script>
